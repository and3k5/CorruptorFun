<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS1 BIOS host</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #9a9; font: 13px/1.4 ui-monospace, monospace; }
  #game { width: 100%; height: 100%; }
  #status { position: absolute; inset: auto 0 0 0; padding: 6px 10px; pointer-events: none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="status">Waiting for a BIOS…</div>
<script>
// Hosts EmulatorJS (pcsx_rearmed core) in its own frame. EmulatorJS keeps its
// state in globals, so the parent page reloads this frame for every boot.
// The BIOS arrives by postMessage from the parent page and never leaves the
// browser. EmulatorJS and the core are fetched from jsDelivr (GPL-3.0,
// https://github.com/EmulatorJS/EmulatorJS).
(function () {
  const EJS_VERSION = '4.2.3';
  // Storage throws in a sandboxed frame; EmulatorJS copes when it's missing.
  for (const name of ['localStorage', 'sessionStorage', 'indexedDB']) {
    try { Object.defineProperty(window, name, { value: undefined, configurable: true }); } catch {}
  }
  const params = new URLSearchParams(location.search);
  // A same-site path override, used for offline testing only.
  const local = params.get('ejs');
  const safeLocal = local && /^\/[\w\-./]*$/.test(local) && !local.startsWith('//') ? local : null;
  const dataBase = safeLocal ? safeLocal.replace(/\/?$/, '/') + 'emulatorjs/data/'
    : `https://cdn.jsdelivr.net/npm/@emulatorjs/emulatorjs@${EJS_VERSION}/data/`;
  const coreBase = safeLocal ? safeLocal.replace(/\/?$/, '/') + 'core-pcsx_rearmed/'
    : `https://cdn.jsdelivr.net/npm/@emulatorjs/core-pcsx_rearmed@${EJS_VERSION}/`;

  const status = document.getElementById('status');
  // This frame is sandboxed (opaque origin) so a BIOS that wedges the
  // emulator can't freeze the main page. Hence '*' and the source checks.
  const say = (t) => { status.textContent = t; parent.postMessage({ type: 'ps1-status', text: t }, '*'); };

  let booted = false;
  window.addEventListener('message', (ev) => {
    if (ev.source !== parent || !ev.data || ev.data.type !== 'ps1-boot' || booted) return;
    booted = true;
    const { biosZip, disc } = ev.data;
    const gameUrl = disc instanceof File ? disc : URL.createObjectURL(new Blob([disc], { type: 'application/zip' }));

    const files = {};
    for (const f of ['pcsx_rearmed-wasm.data', 'pcsx_rearmed-legacy-wasm.data',
      'pcsx_rearmed-thread-wasm.data', 'pcsx_rearmed-thread-legacy-wasm.data']) files[f] = coreBase + f;
    files['pcsx_rearmed.json'] = coreBase + 'reports/pcsx_rearmed.json';

    Object.assign(window, {
      EJS_DEBUG_XX: params.has('debug'),
      EJS_player: '#game',
      EJS_core: 'psx',
      EJS_pathtodata: dataBase,
      EJS_paths: files,
      EJS_biosUrl: URL.createObjectURL(new Blob([biosZip], { type: 'application/zip' })),
      EJS_gameUrl: gameUrl,
      EJS_gameName: 'corrupted-bios',
      EJS_startOnLoaded: true,
      EJS_language: 'en-US',
      EJS_disableAutoLang: false,
      EJS_disableDatabases: true,
      EJS_disableLocalStorage: true,
      EJS_color: '#2f6f4f',
      EJS_defaultOptions: {
        // Use the real (corrupted) BIOS and don't skip its boot logo.
        pcsx_rearmed_bios: 'auto',
        pcsx_rearmed_show_bios_bootlogo: 'enabled',
      },
      EJS_onGameStart: () => { say('Running'); setTimeout(() => (status.style.display = 'none'), 1500); },
    });

    // The npm build ships no minified stylesheet, so load the plain one up front.
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = dataBase + 'emulator.css';
    document.head.appendChild(css);

    say('Loading emulator…');
    const s = document.createElement('script');
    s.src = dataBase + 'loader.js';
    s.onerror = () => say('Could not load the emulator from the CDN.');
    document.body.appendChild(s);
  });

  parent.postMessage({ type: 'ps1-ready' }, '*');
})();
</script>
</body>
</html>
